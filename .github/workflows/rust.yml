name: Rust

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Windows x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows x86
          - os: windows-2022
            target: i686-pc-windows-msvc
          # Windows GNU x86_64 (cross-compiled with MinGW)
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.target }}
      
      - name: Setup Windows Build Environment
        if: matrix.os == 'windows-2022'
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $GITHUB_ENV
        shell: bash
    
      - name: Install Cross-Compilation Dependencies
        if: contains(matrix.target, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        shell: bash
      
      - name: Set Cross-Compilation Environment Variables
        if: contains(matrix.target, 'aarch64-unknown-linux-gnu')
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        shell: bash

      - name: Install MinGW Cross-Compilation Dependencies
        if: contains(matrix.target, 'windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Set MinGW Cross-Compilation Environment Variables
        if: contains(matrix.target, 'windows-gnu')
        run: |
          echo "CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
        shell: bash
      
      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --verbose ${{ matrix.os == 'windows-2022' && '--release' || '' }} --target ${{ matrix.target }}

      - name: Verify static MinGW runtime linking
        if: contains(matrix.target, 'windows-gnu')
        shell: bash
        run: |
          cargo build --verbose --target "${{ matrix.target }}" --example advanced
          cargo build --verbose --target "${{ matrix.target }}" --features static-cpp-runtime --example advanced
          imports="$(x86_64-w64-mingw32-objdump -p "target/${{ matrix.target }}/debug/examples/advanced.exe" | sed -n 's/.*DLL Name: //p')"
          echo "$imports"
          if grep -Eiq 'libstdc\+\+|libgcc|libwinpthread|libssp|libgomp|libatomic|libquadmath' <<<"$imports"; then
            echo "Static runtime build still imports a MinGW runtime DLL"
            exit 1
          fi
      
      - name: Run tests
        if: contains(matrix.target, 'x86_64') && !contains(matrix.target, 'windows-gnu')
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --verbose ${{ matrix.os == 'windows-2022' && '--release' || '' }} --target ${{ matrix.target }}

  clippy:
    name: Clippy (strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Run strict Clippy
        run: cargo clippy --all-targets -- -D warnings

  performance-smoke:
    name: Performance smoke
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      OCR_RS_PERF_TESTS: "1"
      OCR_RS_PERF_ITERS: "3"
      OCR_RS_PERF_BATCH_SIZE: "8"
      OCR_RS_PERF_REGRESSION_LIMIT: "1.15"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run release performance smoke tests
        run: |
          set -o pipefail
          cargo test --release --test performance_tests -- --nocapture --test-threads=1 2>&1 | tee performance-results.log

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.sha }}
          path: performance-results.log
          retention-days: 14

      - name: Compile Criterion benchmarks
        run: cargo bench --bench bench_metrics --no-run
